[project]
name = "whittle"
version = "0.2.0"
description = "Find out whether an agent change will help before you ship it, from logged production traffic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gittins>=2.1.0"]

[project.scripts]
whittle = "whittle.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whittle"]
